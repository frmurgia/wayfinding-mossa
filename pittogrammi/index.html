<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pittogrammi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&family=National+Park:wght@300..700&display=swap" rel="stylesheet">
<style>
  :root { --blu: #3b48e0; --nero: #1d1d1b; --fondo: #f4f4fb; --giallo: #f2d21f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Menlo, Consolas, monospace; color: var(--blu); background: var(--fondo); font-size: 13px; line-height: 1.4; }
  header { padding: 10px 16px; background: #fff; border-bottom: 2px solid var(--blu); display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; letter-spacing: .04em; }
  h2 { font-size: 12px; letter-spacing: .08em; margin-bottom: 8px; }
  main { display: grid; grid-template-columns: 190px minmax(0, 1fr) 250px; gap: 14px; padding: 14px 16px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .box { background: #fff; border: 1.5px solid var(--blu); padding: 10px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  button, .scelta label { font: inherit; color: var(--blu); background: #fff; border: 1.5px solid var(--blu); padding: 6px 9px; cursor: pointer; }
  button:hover, .scelta label:hover { background: var(--fondo); }
  button.pieno { background: var(--blu); color: #fff; font-weight: 700; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--giallo); outline-offset: 1px; }
  .scelta { display: flex; flex-wrap: wrap; }
  .scelta input { position: absolute; opacity: 0; pointer-events: none; }
  .scelta label { margin: 0 -1.5px -1.5px 0; display: flex; align-items: center; gap: 4px; }
  .scelta input:checked + label { background: var(--blu); color: #fff; }
  .scelta input:focus-visible + label { outline: 3px solid var(--giallo); }
  .scelta svg { width: 20px; height: 20px; display: block; }
  .scelta input:checked + label svg * { fill: #fff; }
  .barra { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px; border-bottom: 1.5px solid var(--blu); }
  .barra .spazio { flex: 1; }
  .spunta { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #vista { display: block; width: 100%; height: auto; margin-top: 8px; border: 1px solid #c9cdf7; }
  input[type=checkbox] { accent-color: var(--blu); width: 15px; height: 15px; }
  .passi { display: flex; align-items: center; gap: 0; } .passi span { margin-right: 8px; } .passi output { min-width: 3ch; text-align: center; font-weight: 700; border-top: 1.5px solid var(--blu); border-bottom: 1.5px solid var(--blu); padding: 6px 4px; }
  #griglia { display: block; width: 100%; height: auto; max-height: calc(100vh - 330px); min-height: 280px; touch-action: none; cursor: crosshair; user-select: none; background: #fff; }
  .tela { background: #fff; border: 1.5px solid var(--blu); }
  #lista button { display: block; width: 100%; text-align: left; margin-bottom: -1.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lista button.att { background: var(--blu); color: #fff; }
  .fila { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .campo { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }
  input[type=number], input[type=text], select { font: inherit; color: var(--blu); border: 1.5px solid var(--blu); padding: 4px 6px; background: #fff; width: 9ch; }
  input[type=text] { width: 100%; }
  select { width: auto; }
  #famiglia { grid-column: 1 / -1; }
  #strip { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end; }
  .tessera { text-align: center; cursor: pointer; color: var(--nero); }
  .tessera svg { width: 84px; height: 84px; display: block; margin: 0 auto 4px; border: 1px solid #c9cdf7; }
  .tessera.att svg { border: 2px solid var(--blu); }
  .tessera.altro { cursor: default; }
  .tessera.altro svg { border-style: dashed; }
  #stato { font-size: 11.5px; margin-top: 6px; }
  #stato.su { color: #12805c; }
  .tessera span { font-size: 15px; font-weight: 500; display: block; }
  .tessera small { font-size: 10.5px; color: var(--blu); }
  .nota { font-size: 11.5px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>PITTOGRAMMI</h1>
</header>

<main>
  <div class="col">
    <div class="box" id="box-classe" hidden>
      <h2>CLASSE</h2>
      <input type="text" id="classe" placeholder="codice della classe" aria-label="Codice della classe">
      <div class="fila"><button id="b-collega">COLLEGATI</button></div>
      <p id="stato">Non collegati: il lavoro resta su questo computer.</p>
    </div>
    <div class="box">
      <h2>I NOSTRI SEGNI</h2>
      <div id="lista"></div>
      <div class="fila">
        <button id="b-nuovo">+ NUOVO SEGNO</button>
        <button id="b-togli">TOGLI QUESTO</button>
      </div>
    </div>
    <div class="box">
      <h2>CHI SIETE</h2>
      <input type="text" id="autori" placeholder="es. Rossi Bianchi" aria-label="Cognomi della coppia">
      <p class="nota">Va nel nome di ogni file che salvate.</p>
    </div>
    <div class="box">
      <h2>NOME DEL LUOGO</h2>
      <input type="text" id="nome" aria-label="Nome del luogo">
    </div>
  </div>

  <section class="tela">
    <div class="barra">
      <div class="scelta" role="radiogroup" aria-label="Strumento">
        <input type="radio" name="strumento" id="s-linea" value="linea" checked><label for="s-linea">LINEA</label>
        <input type="radio" name="strumento" id="s-cerchio" value="cerchio"><label for="s-cerchio">CERCHIO</label>
        <input type="radio" name="strumento" id="s-arco" value="arco"><label for="s-arco">ARCO</label>
        <input type="radio" name="strumento" id="s-raggio" value="raggio"><label for="s-raggio">CAMBIA UN ANGOLO</label>
        <input type="radio" name="strumento" id="s-gomma" value="gomma"><label for="s-gomma">GOMMA</label>
      </div>
      <div class="passi" role="group" aria-label="Raggio degli angoli">
        <span>RAGGIO</span><button id="b-rmeno" aria-label="Raggio più piccolo">−</button><output id="raggio">0</output><button id="b-rpiu" aria-label="Raggio più grande">+</button>
      </div>
      <label class="spunta"><input type="checkbox" id="archi"> VEDI GLI ARCHI</label>
      <label class="spunta"><input type="checkbox" id="diagonali" checked> GRIGLIA DI COSTRUZIONE</label>
      <span class="spazio"></span>
      <button id="b-fine" title="Invio">FINE LINEA</button>
      <button id="b-annulla" title="Ctrl+Z">ANNULLA</button>
      <button id="b-cancella">CANCELLA IL DISEGNO</button>
    </div>
    <svg id="griglia" viewBox="-0.8 -0.5 13.3 13.3" role="img" aria-label="Griglia su cui disegnare"></svg>
  </section>

  <div class="col">
    <div class="box">
      <h2>ESEMPIO DA COPIARE</h2>
      <select id="modello" aria-label="Esempio da copiare" style="width:100%"></select>
      <svg id="vista" viewBox="-0.7 -0.3 13 13" role="img" aria-label="L'esempio sulla griglia" hidden></svg>
    </div>
    <div class="box">
      <h2>REGOLE DI TUTTA LA FAMIGLIA</h2>
      <div class="campo"><label for="linea">Linea larga (mm)</label><input type="number" id="linea" min="1" max="12" step="0.5"></div>
      <div class="campo"><label for="lati">Griglia</label>
        <select id="lati"><option value="10">10 × 10</option><option value="12">12 × 12</option></select></div>
      <div class="campo"><label for="lato">Una casella (mm)</label><input type="number" id="lato" min="2" max="30" step="0.5"></div>
      <div class="campo"><label for="font">Scritta</label>
        <select id="font"><option>Lexend</option><option>National Park</option></select></div>
      <p class="nota">Cambi una regola e cambiano tutti i segni insieme.</p>
    </div>
    <div class="box">
      <h2>SCARICA</h2>
      <div class="fila">
        <button id="b-svg">QUESTO SEGNO (SVG)</button>
        <button id="b-svg-tutti">TUTTI I SEGNI (SVG)</button>
        <button id="b-stl">QUESTO SEGNO PER LA STAMPA 3D (STL)</button>
      </div>
      <div class="campo"><label for="base">Con la tessera sotto</label><input type="checkbox" id="base" checked></div>
      <p class="nota" id="misure"></p>
    </div>
    </div>
  </div>

  <div class="box" id="famiglia">
    <h2>LA FAMIGLIA</h2>
    <div id="strip"></div>
  </div>
</main>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const svg = $('griglia');
  const CHIAVE = 'segni-della-scuola';
  let N = 12;                        // caselle per lato: lo decide la regola della famiglia

  /* ---------- stato ----------
     Un segno è fatto di linee sulla griglia (0–10, y verso l'alto).
     tratti: [{ pts: [[x, y], ...], r: [raggio di ogni angolo, in caselle], chiusa }]
     Cerchi e mezzi cerchi hanno fissa: true e i loro punti sono già la curva. */
  const nuovoId = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16)));
  const nuovoSegno = nome => ({ id: nuovoId(), nome, tratti: [] });
  const RAGGIO_MAX = 6;
  let S = { autori: '', classe: '', segni: [nuovoSegno('SEGNO 1')], att: 0, regole: { linea: 2, lato: 5, lati: 12, font: 'Lexend' } };
  let aperto = false, centro = null, arco = [], sopra = null, grezzo = null, raggio = 0;
  const storia = [];

  const seg = () => S.segni[S.att];
  const n = v => +(+v).toFixed(2);
  const uguali = (a, b) => Math.abs(a[0] - b[0]) < 1e-6 && Math.abs(a[1] - b[1]) < 1e-6;
  const strumento = () => document.querySelector('input[name=strumento]:checked').value;
  const salva = () => { storia.push(JSON.stringify({ segni: S.segni, att: S.att })); if (storia.length > 200) storia.shift(); };

  /* ---------- forme ---------- */
  const arcoPts = (cx, cy, r, a0, a1, k) => Array.from({ length: k + 1 }, (_, i) => {
    const g = (a0 + (a1 - a0) * i / k) * Math.PI / 180;
    return [cx + r * Math.cos(g), cy + r * Math.sin(g)];
  });
  const cerchio = (cx, cy, r, k) => arcoPts(cx, cy, r, 0, 360, k).slice(0, k);
  function mezzoCerchio(a, b, p) {
    const lato = (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
    if (Math.abs(lato) < 1e-9) return null;
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], r = Math.hypot(b[0] - a[0], b[1] - a[1]) / 2;
    const a0 = Math.atan2(a[1] - m[1], a[0] - m[0]) * 180 / Math.PI;
    const pts = arcoPts(m[0], m[1], r, a0, a0 + (lato > 0 ? -180 : 180), 20);
    pts[0] = a.slice(); pts[20] = b.slice();
    return pts;
  }
  // arco da a a b con raggio R, gonfio dal lato del punto p
  function arcoRaggio(a, b, R, p) {
    const c = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const lato = (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
    if (!c || Math.abs(lato) < 1e-9 || R < c / 2 - 1e-9) return null;
    if (R - c / 2 < 1e-9) return mezzoCerchio(a, b, p);
    const verso = lato > 0 ? 1 : -1, nx = -(b[1] - a[1]) / c * verso, ny = (b[0] - a[0]) / c * verso;
    const dc = Math.sqrt(R * R - c * c / 4), cen = [(a[0] + b[0]) / 2 - nx * dc, (a[1] + b[1]) / 2 - ny * dc];
    const a0 = Math.atan2(a[1] - cen[1], a[0] - cen[0]);
    let da = Math.atan2(b[1] - cen[1], b[0] - cen[0]) - a0;
    while (da > Math.PI) da -= 2 * Math.PI;
    while (da < -Math.PI) da += 2 * Math.PI;
    const pts = Array.from({ length: 25 }, (_, i) => [cen[0] + R * Math.cos(a0 + da * i / 24), cen[1] + R * Math.sin(a0 + da * i / 24)]);
    pts[0] = a.slice(); pts[24] = b.slice();
    return pts;
  }
  // lo strumento Arco: il raggio si sceglie con il puntatore e va a passi interi
  // (il più piccolo possibile è il mezzo cerchio). Restituisce i punti e il raggio.
  function arcoTra(a, b, p) {
    const c = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const lato = (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
    if (!c || Math.abs(lato) < 1e-9) return null;
    const h = Math.min(Math.abs(lato) / c, c / 2);              // quanto il puntatore è lontano dalla corda
    const voluto = (c * c / 4 + h * h) / (2 * h);
    let R = c / 2;
    for (let k = Math.floor(c / 2) + 1; k <= 40; k++) if (Math.abs(k - voluto) < Math.abs(R - voluto)) R = k;
    return { pts: arcoRaggio(a, b, R, p), r: R };
  }
  // la linea con gli angoli arrotondati: da qui passano schermo, SVG, gomma e stampa 3D
  function svolgi(t) {
    const p = t.pts, r = t.r, k = p.length;
    if (t.fissa || !r || k < 3) return p;
    const out = [];
    for (let i = 0; i < k; i++) {
      const dentro = t.chiusa || (i > 0 && i < k - 1), rr = dentro ? (r[i] || 0) : 0;
      const a = p[(i - 1 + k) % k], b = p[i], c = p[(i + 1) % k];
      const la = Math.hypot(a[0] - b[0], a[1] - b[1]), lc = Math.hypot(c[0] - b[0], c[1] - b[1]);
      if (!rr || !la || !lc) { out.push(b); continue; }
      const u = [(a[0] - b[0]) / la, (a[1] - b[1]) / la], v = [(c[0] - b[0]) / lc, (c[1] - b[1]) / lc];
      const th = Math.acos(Math.max(-1, Math.min(1, u[0] * v[0] + u[1] * v[1])));
      if (th < 1e-3 || Math.PI - th < 1e-3) { out.push(b); continue; }
      // un lato in comune con un altro angolo si divide a metà; l'ultimo lato di una linea aperta si usa tutto
      const maxA = !t.chiusa && i === 1 ? la : la / 2, maxC = !t.chiusa && i === k - 2 ? lc : lc / 2;
      const tg = Math.tan(th / 2), d = Math.min(rr / tg, maxA, maxC), re = d * tg;
      const bis = [u[0] + v[0], u[1] + v[1]], lb = Math.hypot(bis[0], bis[1]), dc = re / Math.sin(th / 2);
      const cen = [b[0] + bis[0] / lb * dc, b[1] + bis[1] / lb * dc];
      const a1 = Math.atan2(b[1] + u[1] * d - cen[1], b[0] + u[0] * d - cen[0]);
      let da = Math.atan2(b[1] + v[1] * d - cen[1], b[0] + v[0] * d - cen[0]) - a1;
      while (da > Math.PI) da -= 2 * Math.PI;
      while (da < -Math.PI) da += 2 * Math.PI;
      for (let j = 0; j <= 12; j++) out.push([cen[0] + re * Math.cos(a1 + da * j / 12), cen[1] + re * Math.sin(a1 + da * j / 12)]);
    }
    return out;
  }
  const punti = pts => pts.map(p => `${n(p[0])},${n(N - p[1])}`).join(' ');

  // il segno come elementi SVG, in unità di griglia
  function interno(s, colore, ultimoAperto) {
    const w = S.regole.linea / S.regole.lato;
    return s.tratti.map((t, i) => {
      const col = ultimoAperto && i === s.tratti.length - 1 ? '#3b48e0' : colore;
      if (t.pts.length === 1) return `<circle cx="${t.pts[0][0]}" cy="${N - t.pts[0][1]}" r="${n(w / 2)}" fill="${col}"/>`;
      return `<${t.chiusa ? 'polygon' : 'polyline'} points="${punti(svolgi(t))}" fill="none" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
    }).join('');
  }

  /* ---------- esempi da copiare ----------
     Stesso formato dei segni: linee sugli incroci, r = raggio di ogni angolo. */
  const mezzo = (a, b, p) => ({ pts: mezzoCerchio(a, b, p), fissa: true });
  const tondo = (cx, cy, r) => ({ pts: cerchio(cx, cy, r, 36), chiusa: true, fissa: true });
  const arcoR = (a, b, R, p) => ({ pts: arcoRaggio(a, b, R, p), fissa: true });
  const chiuso = pts => ({ pts, chiusa: true });
  const arcata = (x0, x1, y0, y1, r) => ({ pts: [[x0, y0], [x0, y1], [x1, y1], [x1, y0]], r: [0, r, r, 0] });
  // facciate costruite su griglia 12 × 12 con archi, timpani e cerchi
  const MODELLI = [
    { nome: 'Portico con torre', tratti: [
        chiuso([[0, 0], [12, 0], [12, 7], [0, 7]]),
        arcata(1, 3, 0, 4, 1), arcata(4, 8, 0, 6, 2), arcata(9, 11, 0, 4, 1),
        { pts: [[0, 7], [4, 9], [8, 9], [12, 7]] },
        { pts: [[4, 9], [4, 10], [6, 12], [8, 10], [8, 9]] }] },
    { nome: 'Chiesa con rosone', tratti: [
        chiuso([[2, 0], [10, 0], [10, 5], [2, 5]]),
        arcata(5, 7, 0, 3, 1),
        { pts: [[4, 5], [4, 9], [8, 9], [8, 5]] },
        arcoR([2, 5], [4, 7], 2, [4, 5]), arcoR([10, 5], [8, 7], 2, [8, 5]),
        tondo(6, 7, 1),
        { pts: [[4, 9], [6, 11], [8, 9]] },
        { pts: [[6, 11], [6, 12]] }] },
    { nome: 'Torre con navata', tratti: [
        chiuso([[1, 0], [5, 0], [5, 8], [1, 8]]),
        tondo(3, 6, 1),
        arcata(2, 4, 0, 3, 1),
        chiuso([[0, 8], [6, 8], [6, 9], [0, 9]]),
        { pts: [[1, 9], [3, 11], [5, 9]] },
        { pts: [[3, 11], [3, 12]] },
        { pts: [[5, 4], [11, 4], [11, 0], [5, 0]] },
        { pts: [[5, 4], [8, 7], [11, 4]] },
        arcata(7, 9, 0, 2, 1)] },
    { nome: 'Tempio con cupola', tratti: [
        chiuso([[1, 0], [11, 0], [11, 1], [1, 1]]),
        chiuso([[3, 1], [9, 1], [9, 5], [3, 5]]),
        arcata(5, 7, 1, 4, 1),
        { pts: [[2, 5], [10, 5]] },
        arcoR([3, 5], [9, 5], 3, [6, 8]),
        chiuso([[5, 8], [7, 8], [7, 10], [5, 10]]),
        { pts: [[6, 10], [6, 12]] }] }
  ];
  let modello = null;

  /* ---------- disegno ---------- */
  function disegna() {
    let o = '';
    for (let i = 0; i <= N; i++) {
      const w = i === 0 || i === N ? 0.05 : 0.02;
      o += `<line x1="${i}" y1="0" x2="${i}" y2="${N}" stroke="#3b48e0" stroke-width="${w}"/><line x1="0" y1="${i}" x2="${N}" y2="${i}" stroke="#3b48e0" stroke-width="${w}"/>`;
      o += `<text x="${i}" y="${N + 0.5}" font-size="0.32" text-anchor="middle" fill="#3b48e0">${i}</text><text x="-0.25" y="${N - i + 0.11}" font-size="0.32" text-anchor="end" fill="#3b48e0">${i}</text>`;
    }
    const st = strumento();
    if ($('diagonali').checked) {
      // griglia di costruzione: cerchi iscritti nei blocchi (per 12: blocchi da 6 e da 4) …
      for (const d of [2, 3, 5]) {
        if (N % d) continue;
        const r = N / (2 * d);
        for (let i = 0; i < d; i++) for (let j = 0; j < d; j++)
          o += `<circle cx="${r * (2 * i + 1)}" cy="${N - r * (2 * j + 1)}" r="${r}" fill="none" stroke="#b4bcf5" stroke-width="0.03"/>`;
      }
      // … e le linee a 45° che passano per un incrocio sì e uno no
      for (let k = -N + 2; k < N; k += 2) {
        const x0 = Math.max(0, k), x1 = Math.min(N, N + k);
        o += `<line x1="${x0}" y1="${N - (x0 - k)}" x2="${x1}" y2="${N - (x1 - k)}" stroke="#8f9bf2" stroke-width="0.03"/>`;
      }
      for (let k = 2; k < 2 * N; k += 2) {
        const x0 = Math.max(0, k - N), x1 = Math.min(N, k);
        o += `<line x1="${x0}" y1="${N - (k - x0)}" x2="${x1}" y2="${N - (k - x1)}" stroke="#8f9bf2" stroke-width="0.03"/>`;
      }
    }
    if ($('archi').checked) {
      // i cerchi del raggio scelto, uno accanto all'altro: mostrano dove passa una curva di quel raggio
      const r = Math.max(1, raggio);
      for (let x = r; x <= N - r; x += 2 * r) for (let y = r; y <= N - r; y += 2 * r)
        o += `<circle cx="${x}" cy="${N - y}" r="${r}" fill="none" stroke="#8f9bf2" stroke-width="0.035"/>`;
    }
    o += interno(seg(), '#1d1d1b', aperto);
    if (aperto) {

      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'pittogrammi_segni' }, p => partenza(p.old.id))
      .subscribe(st => { if (st === 'SUBSCRIBED') contaStato(); else if (st !== 'CLOSED') stato('Collegamento interrotto, riprovo…'); });
    tutto(); invia();
  }
  $('box-classe').hidden = !(CLOUD.url && CLOUD.chiave);
  $('b-collega').onclick = () => collega($('classe').value);

  // per le prove
  window.segni = { stato: () => S, altri: () => altri, triangoli: () => triangoli(seg()), svgSegno: () => svgSegno(seg()), svgTutti };

  try {
    const m = JSON.parse(localStorage.getItem(CHIAVE));
    if (m && Array.isArray(m.segni) && m.segni.length) { S.segni = m.segni; S.att = Math.min(m.att || 0, m.segni.length - 1); Object.assign(S.regole, m.regole || {}); S.autori = m.autori || ''; S.classe = m.classe || ''; }
  } catch (e) { /* si parte da zero */ }
  S.segni.forEach(s => { if (!s.id) s.id = nuovoId(); });
  $('classe').value = S.classe;
  tutto();
  if (S.classe && CLOUD.url && CLOUD.chiave) collega(S.classe);
})();
</script>
</body>
</html>
